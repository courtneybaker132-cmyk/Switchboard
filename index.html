<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Retro TV</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: monospace;
    -webkit-user-select: none;
    user-select: none;
}

#screen {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
}

/* CRT scanlines */

#scanlines {
    pointer-events: none;
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;

    background:
    repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0),
        rgba(0,0,0,0) 3px,
        rgba(0,0,0,0.18) 4px,
        rgba(0,0,0,0.18) 5px
    );

    z-index: 20;
}

/* darkened CRT edges */

#vignette {
    pointer-events: none;
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;

    box-shadow:
        inset 0 0 100px rgba(0,0,0,0.75);

    z-index: 21;
}

/* Scene title */

#sceneLabel {
    position: absolute;
    top: 18px;
    left: 22px;

    color: rgba(255,255,255,0.6);

    font-size: 16px;
    letter-spacing: 2px;

    z-index: 30;
}

/* Controls */

#controls {
    position: absolute;
    bottom: 22px;
    left: 50%;

    width: 700px;
    margin-left: -350px;

    text-align: center;

    background: rgba(0,0,0,0.72);

    padding: 12px 0;

    border-radius: 12px;

    z-index: 40;

    opacity: 0;
}

.control {
    display: inline-block;

    margin: 0 5px;

    padding: 13px 18px;

    background: rgba(255,255,255,0.14);

    color: white;

    border-radius: 8px;

    font-size: 15px;
}

.control:active {
    background: rgba(255,255,255,0.35);
}

/* boot screen */

#boot {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: white;

    text-align: center;

    z-index: 100;
}

#bootTitle {
    margin-top: 220px;

    font-size: 52px;

    letter-spacing: 10px;
}

#bootText {
    margin-top: 25px;

    font-size: 18px;

    color: #888;
}

</style>
</head>

<body>

<div id="screen">

<canvas id="gameCanvas"
width="1280"
height="720"></canvas>

<div id="scanlines"></div>

<div id="vignette"></div>

<div id="sceneLabel">
RETRO TV
</div>

<div id="controls">

<span class="control"
onclick="previousScene()">
◀
</span>

<span class="control"
onclick="togglePause()"
id="pauseButton">
PAUSE
</span>

<span class="control"
onclick="nextScene()">
▶
</span>

<span class="control"
onclick="toggleShuffle()"
id="shuffleButton">
SHUFFLE OFF
</span>

<span class="control"
onclick="changeSpeed()"
id="speedButton">
30 SEC
</span>

</div>

<div id="boot">

<div id="bootTitle">
RETRO TV
</div>

<div id="bootText">
INSERT COIN
</div>

</div>

</div>

<script>

/* =======================================================
   BASIC SETUP
======================================================= */

var canvas =
    document.getElementById("gameCanvas");

var ctx =
    canvas.getContext("2d");

var W = 1280;
var H = 720;

var scene = 0;

var sceneCount = 6;

var frame = 0;

var paused = false;

var shuffle = false;

var controlsVisible = false;

var controlsTimer = null;

var sceneSeconds = 30;

var sceneTimer = 0;


/* =======================================================
   OLD-BROWSER ANIMATION FALLBACK
======================================================= */

var animationFrame =
    window.requestAnimationFrame ||
    window.webkitRequestAnimationFrame ||
    function(callback) {

        return setTimeout(
            callback,
            33
        );

    };


/* =======================================================
   HELPERS
======================================================= */

function clear(color) {

    ctx.fillStyle = color;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}

function rect(x,y,w,h,color) {

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.floor(x),
        Math.floor(y),
        Math.floor(w),
        Math.floor(h)
    );

}

function text(value,x,y,size,color) {

    ctx.fillStyle = color;

    ctx.font =
        size + "px monospace";

    ctx.fillText(
        value,
        x,
        y
    );

}

function random(min,max) {

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) + min;

}


/* =======================================================
   SCENE 1
   PIXEL PLATFORMER
======================================================= */

function platformScene() {

    clear("#5bc0eb");

    /* clouds */

    var cloudX =
        (frame * 1.2) % 1500;

    rect(
        1100-cloudX,
        100,
        150,
        35,
        "#ffffff"
    );

    rect(
        1140-cloudX,
        70,
        70,
        40,
        "#ffffff"
    );

    rect(
        450-cloudX/2,
        170,
        160,
        32,
        "#ffffff"
    );

    /* mountains */

    rect(
        0,
        470,
        W,
        250,
        "#43aa8b"
    );

    /* ground */

    rect(
        0,
        590,
        W,
        130,
        "#654321"
    );

    rect(
        0,
        590,
        W,
        22,
        "#8ac926"
    );

    /* bricks */

    var i;

    for(i=0;i<16;i++) {

        rect(
            i*90,
            500,
            70,
            40,
            "#d2691e"
        );

    }

    /* coin */

    var coinY =
        360 +
        Math.sin(frame/8)*18;

    rect(
        780,
        coinY,
        22,
        42,
        "#ffd60a"
    );

    /* player */

    var playerX =
        (frame*3)%1400 - 100;

    var jump =
        Math.abs(
            Math.sin(frame/18)
        ) * 95;

    rect(
        playerX,
        530-jump,
        38,
        38,
        "#ef233c"
    );

    rect(
        playerX+7,
        568-jump,
        26,
        32,
        "#0057b7"
    );

    text(
        "WORLD 1-1",
        35,
        45,
        20,
        "#ffffff"
    );

    text(
        "SCORE 001250",
        1000,
        45,
        20,
        "#ffffff"
    );

}


/* =======================================================
   SCENE 2
   SPACE SHOOTER
======================================================= */

var stars = [];

function initStars() {

    var i;

    for(i=0;i<80;i++) {

        stars.push({
            x: random(0,W),
            y: random(0,H),
            s: random(1,4)
        });

    }

}

function spaceScene() {

    clear("#02020a");

    var i;

    for(i=0;i<stars.length;i++) {

        stars[i].y +=
            stars[i].s;

        if(
            stars[i].y > H
        ) {

            stars[i].y = 0;
            stars[i].x =
                random(0,W);

        }

        rect(
            stars[i].x,
            stars[i].y,
            stars[i].s,
            stars[i].s*2,
            "#ffffff"
        );

    }

    /* ship */

    var shipX =
        580 +
        Math.sin(frame/30)*260;

    rect(
        shipX,
        590,
        90,
        26,
        "#00f5d4"
    );

    rect(
        shipX+30,
        560,
        30,
        65,
        "#00bbf9"
    );

    /* laser */

    if(
        frame%35 < 15
    ) {

        rect(
            shipX+43,
            350,
            5,
            210,
            "#faff00"
        );

    }

    /* enemies */

    for(i=0;i<7;i++) {

        var enemyX =
            160 +
            i*150 +
            Math.sin(
                frame/18+i
            )*50;

        var enemyY =
            130 +
            Math.sin(
                frame/15+i
            )*25;

        rect(
            enemyX,
            enemyY,
            50,
            28,
            "#ff006e"
        );

        rect(
            enemyX+10,
            enemyY+28,
            10,
            15,
            "#ff006e"
        );

        rect(
            enemyX+30,
            enemyY+28,
            10,
            15,
            "#ff006e"
        );

    }

    text(
        "1UP 004850",
        35,
        45,
        22,
        "#00f5d4"
    );

    text(
        "HIGH SCORE 025000",
        500,
        45,
        22,
        "#ffffff"
    );

}


/* =======================================================
   SCENE 3
   NEON RACER
======================================================= */

function racerScene() {

    clear("#10002b");

    /* sunset */

    ctx.fillStyle =
        "#ff4d6d";

    ctx.beginPath();

    ctx.arc(
        640,
        260,
        115,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* horizon */

    rect(
        0,
        360,
        W,
        360,
        "#03001c"
    );

    /* road */

    ctx.fillStyle =
        "#151515";

    ctx.beginPath();

    ctx.moveTo(
        510,
        360
    );

    ctx.lineTo(
        770,
        360
    );

    ctx.lineTo(
        1120,
        720
    );

    ctx.lineTo(
        160,
        720
    );

    ctx.closePath();

    ctx.fill();

    /* moving lane marks */

    var offset =
        (frame*15)%150;

    var i;

    for(i=0;i<7;i++) {

        var y =
            380 +
            i*70 +
            offset;

        var width =
            (y-340)/7;

        rect(
            640-width/2,
            y,
            width,
            25,
            "#ffffff"
        );

    }

    /* neon grid */

    ctx.strokeStyle =
        "#00f5d4";

    ctx.lineWidth = 2;

    for(i=0;i<12;i++) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            400+i*40
        );

        ctx.lineTo(
            W,
            400+i*40
        );

        ctx.stroke();

    }

    /* car */

    rect(
        525,
        560,
        230,
        80,
        "#ff006e"
    );

    rect(
        570,
        520,
        140,
        55,
        "#7209b7"
    );

    rect(
        545,
        635,
        45,
        32,
        "#111111"
    );

    rect(
        690,
        635,
        45,
        32,
        "#111111"
    );

    text(
        "NEON HIGHWAY",
        40,
        55,
        26,
        "#00f5d4"
    );

    text(
        "220 KM/H",
        1030,
        55,
        24,
        "#ff006e"
    );

}


/* =======================================================
   SCENE 4
   DUNGEON RPG
======================================================= */

function dungeonScene() {

    clear("#161a1d");

    var tile = 80;

    var x;
    var y;

    for(y=0;y<9;y++) {

        for(x=0;x<16;x++) {

            if(
                (x+y)%2===0
            ) {

                rect(
                    x*tile,
                    y*tile,
                    tile,
                    tile,
                    "#20252a"
                );

            }

        }

    }

    /* torch glow */

    rect(
        140,
        150,
        12,
        60,
        "#8b4513"
    );

    rect(
        130,
        115+
        Math.sin(frame/5)*6,
        34,
        40,
        "#ff9500"
    );

    rect(
        1110,
        150,
        12,
        60,
        "#8b4513"
    );

    rect(
        1100,
        115+
        Math.sin(frame/5)*6,
        34,
        40,
        "#ff9500"
    );

    /* hero */

    var heroX =
        570+
        Math.sin(frame/30)*70;

    rect(
        heroX,
        450,
        55,
        75,
        "#4361ee"
    );

    rect(
        heroX+10,
        410,
        35,
        45,
        "#f2cc8f"
    );

    /* sword */

    rect(
        heroX+58,
        420,
        8,
        100,
        "#dddddd"
    );

    /* slime */

    var slime =
        860+
        Math.sin(frame/17)*45;

    rect(
        slime,
        480,
        80,
        45,
        "#70e000"
    );

    rect(
        slime+15,
        465,
        50,
        25,
        "#70e000"
    );

    rect(
        slime+18,
        480,
        8,
        8,
        "#000000"
    );

    rect(
        slime+50,
        480,
        8,
        8,
        "#000000"
    );

    text(
        "DUNGEON FLOOR 07",
        35,
        48,
        23,
        "#d8f3dc"
    );

    text(
        "HP ███████░░░",
        35,
        685,
        22,
        "#ff4d6d"
    );

}


/* =======================================================
   SCENE 5
   ARCADE FIGHTER
======================================================= */

function fighterScene() {

    clear("#f7b267");

    /* city */

    rect(
        0,
        360,
        W,
        360,
        "#444444"
    );

    var i;

    for(i=0;i<10;i++) {

        rect(
            i*140,
            150+random(0,120),
            110,
            300,
            "#222222"
        );

    }

    /* ground */

    rect(
        0,
        560,
        W,
        160,
        "#555555"
    );

    /* health bars */

    rect(
        80,
        65,
        430,
        30,
        "#222222"
    );

    rect(
        85,
        70,
        380,
        20,
        "#43aa8b"
    );

    rect(
        770,
        65,
        430,
        30,
        "#222222"
    );

    rect(
        815,
        70,
        380,
        20,
        "#ff595e"
    );

    /* fighters */

    var punch =
        Math.sin(frame/12)*25;

    rect(
        300,
        400,
        70,
        150,
        "#277da1"
    );

    rect(
        315,
        355,
        45,
        50,
        "#f2cc8f"
    );

    rect(
        360,
        425,
        90+punch,
        25,
        "#277da1"
    );

    rect(
        900,
        400,
        70,
        150,
        "#d90429"
    );

    rect(
        915,
        355,
        45,
        50,
        "#f2cc8f"
    );

    rect(
        820-punch,
        425,
        90+punch,
        25,
        "#d90429"
    );

    text(
        "PLAYER 1",
        85,
        55,
        20,
        "#ffffff"
    );

    text(
        "PLAYER 2",
        1090,
        55,
        20,
        "#ffffff"
    );

    text(
        "ROUND 2",
        575,
        55,
        25,
        "#ffffff"
    );

}


/* =======================================================
   SCENE 6
   FALLING BLOCKS
======================================================= */

var blocks = [];

function initBlocks() {

    var i;

    for(i=0;i<45;i++) {

        blocks.push({
            x: random(4,11)*40,
            y: random(3,15)*40,
            c: random(0,5)
        });

    }

}

function blocksScene() {

    clear("#080808");

    var colors = [
        "#00bbf9",
        "#f15bb5",
        "#fee440",
        "#00f5d4",
        "#9b5de5",
        "#ff006e"
    ];

    /* game board */

    rect(
        400,
        40,
        480,
        650,
        "#111111"
    );

    ctx.strokeStyle =
        "#333333";

    ctx.lineWidth = 2;

    var i;

    for(i=0;i<13;i++) {

        ctx.beginPath();

        ctx.moveTo(
            400+i*40,
            40
        );

        ctx.lineTo(
            400+i*40,
            690
        );

        ctx.stroke();

    }

    for(i=0;i<17;i++) {

        ctx.beginPath();

        ctx.moveTo(
            400,
            40+i*40
        );

        ctx.lineTo(
            880,
            40+i*40
        );

        ctx.stroke();

    }

    for(i=0;i<blocks.length;i++) {

        rect(
            blocks[i].x*40,
            blocks[i].y*40,
            38,
            38,
            colors[
                blocks[i].c
            ]
        );

    }

    /* falling piece */

    var fallY =
        ((frame*3)%600)+40;

    rect(
        600,
        fallY,
        38,
        38,
        "#00f5d4"
    );

    rect(
        640,
        fallY,
        38,
        38,
        "#00f5d4"
    );

    rect(
        680,
        fallY,
        38,
        38,
        "#00f5d4"
    );

    rect(
        640,
        fallY-40,
        38,
        38,
        "#00f5d4"
    );

    text(
        "LINES",
        95,
        160,
        22,
        "#ffffff"
    );

    text(
        "042",
        95,
        200,
        36,
        "#fee440"
    );

    text(
        "NEXT",
        960,
        160,
        22,
        "#ffffff"
    );

}


/* =======================================================
   DRAW SCENE
======================================================= */

function draw() {

    if(
        paused===false
    ) {

        frame++;

        if(
            scene===0
        ) platformScene();

        if(
            scene===1
        ) spaceScene();

        if(
            scene===2
        ) racerScene();

        if(
            scene===3
        ) dungeonScene();

        if(
            scene===4
        ) fighterScene();

        if(
            scene===5
        ) blocksScene();

    }

    animationFrame(draw);

}


/* =======================================================
   SCENE CONTROL
======================================================= */

var sceneNames = [

    "PIXEL KINGDOM",

    "STAR DEFENDER",

    "NEON HIGHWAY",

    "DUNGEON QUEST",

    "STREET BATTLE",

    "BLOCK DROP"

];

function updateSceneLabel() {

    document.getElementById(
        "sceneLabel"
    ).innerHTML =
        "RETRO TV · " +
        sceneNames[scene];

}

function nextScene() {

    if(
        shuffle===true
    ) {

        scene =
            random(
                0,
                sceneCount-1
            );

    }

    else {

        scene++;

        if(
            scene>=sceneCount
        ) {

            scene=0;

        }

    }

    frame=0;

    sceneTimer=0;

    updateSceneLabel();

}

function previousScene() {

    scene--;

    if(
        scene<0
    ) {

        scene=
            sceneCount-1;

    }

    frame=0;

    sceneTimer=0;

    updateSceneLabel();

}

function togglePause() {

    paused =
        !paused;

    if(
        paused
    ) {

        document.getElementById(
            "pauseButton"
        ).innerHTML =
            "PLAY";

    }

    else {

        document.getElementById(
            "pauseButton"
        ).innerHTML =
            "PAUSE";

    }

}

function toggleShuffle() {

    shuffle =
        !shuffle;

    if(
        shuffle
    ) {

        document.getElementById(
            "shuffleButton"
        ).innerHTML =
            "SHUFFLE ON";

    }

    else {

        document.getElementById(
            "shuffleButton"
        ).innerHTML =
            "SHUFFLE OFF";

    }

}


/* =======================================================
   SPEED
======================================================= */

function changeSpeed() {

    if(
        sceneSeconds===15
    ) {

        sceneSeconds=30;

    }

    else if(
        sceneSeconds===30
    ) {

        sceneSeconds=60;

    }

    else if(
        sceneSeconds===60
    ) {

        sceneSeconds=120;

    }

    else {

        sceneSeconds=15;

    }

    document.getElementById(
        "speedButton"
    ).innerHTML =
        sceneSeconds +
        " SEC";

    sceneTimer=0;

}


/* =======================================================
   AUTO SCENE TIMER
======================================================= */

function sceneClock() {

    if(
        paused===false
    ) {

        sceneTimer++;

        if(
            sceneTimer>=sceneSeconds
        ) {

            nextScene();

        }

    }

}


/* =======================================================
   TOUCH CONTROLS
======================================================= */

function showControls() {

    document.getElementById(
        "controls"
    ).style.opacity =
        "1";

    controlsVisible=true;

    if(
        controlsTimer
    ) {

        clearTimeout(
            controlsTimer
        );

    }

    controlsTimer =
        setTimeout(
            hideControls,
            5000
        );

}

function hideControls() {

    document.getElementById(
        "controls"
    ).style.opacity =
        "0";

    controlsVisible=false;

}

document.addEventListener(
    "touchstart",
    function() {

        showControls();

    },
    false
);

document.addEventListener(
    "click",
    function() {

        showControls();

    },
    false
);


/* =======================================================
   BOOT
======================================================= */

function hideBoot() {

    document.getElementById(
        "boot"
    ).style.display =
        "none";

}

function start() {

    initStars();

    initBlocks();

    updateSceneLabel();

    setTimeout(
        hideBoot,
        2800
    );

    setInterval(
        sceneClock,
        1000
    );

    draw();

}

start();

</script>

</body>
</html>
