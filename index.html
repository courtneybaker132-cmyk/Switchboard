<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Retro TV</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:monospace;
    -webkit-user-select:none;
    user-select:none;
}

#cabinet{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#070707;
}

#tv{
    position:absolute;
    left:3%;
    top:2%;
    width:94%;
    height:89%;
    background:#171717;
    border-radius:24px;

    box-shadow:
        inset 0 0 0 4px #303030,
        inset 0 0 0 10px #090909,
        0 8px 25px rgba(0,0,0,.9);
}

#picture{
    position:absolute;
    left:2.2%;
    top:3%;
    width:95.6%;
    height:88%;
    background:#000;
    border-radius:17px;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:pixelated;
}

#scanlines{
    pointer-events:none;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:20;

    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 2px,
        rgba(0,0,0,.25) 3px,
        rgba(0,0,0,.25) 4px
    );
}

#vignette{
    pointer-events:none;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:21;

    box-shadow:
        inset 0 0 90px rgba(0,0,0,.85);
}

#glass{
    pointer-events:none;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:22;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.05),
            rgba(255,255,255,0) 22%
        );
}

#osd{
    position:absolute;
    left:22px;
    top:18px;
    z-index:30;
    color:#fff;
    font-size:16px;
    text-shadow:2px 2px #000;
    opacity:.75;
}

#nowPlaying{
    margin-top:4px;
    font-size:12px;
    color:#c5c5c5;
}

#brand{
    position:absolute;
    left:30px;
    bottom:17px;
    color:#6f6f6f;
    letter-spacing:3px;
    font-size:12px;
}

#channel{
    position:absolute;
    right:28px;
    bottom:16px;
    color:#6f6f6f;
    font-size:12px;
}

#led{
    position:absolute;
    right:14px;
    bottom:18px;
    width:7px;
    height:7px;
    border-radius:8px;
    background:#00d26a;
    box-shadow:0 0 8px #00d26a;
}

#controls{
    position:absolute;
    left:50%;
    bottom:20px;
    width:660px;
    margin-left:-330px;
    text-align:center;
    z-index:50;
    padding:10px 0;
    border-radius:13px;
    background:rgba(0,0,0,.82);
    opacity:0;
}

.button{
    display:inline-block;
    padding:11px 15px;
    margin:0 4px;
    min-width:55px;
    color:#fff;
    background:#252525;
    border:1px solid #555;
    border-radius:8px;
    font-size:13px;
}

.button:active{
    background:#777;
}

#static{
    display:none;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:35;

    background:
    repeating-linear-gradient(
        0deg,
        #111 0px,
        #999 1px,
        #222 2px,
        #777 3px,
        #000 4px
    );

    opacity:.85;
}

#interactiveHint{
    display:none;
    position:absolute;
    left:0;
    bottom:15px;
    width:100%;
    text-align:center;
    color:#fff;
    font-size:13px;
    z-index:32;
    text-shadow:2px 2px #000;
}

#startScreen{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    z-index:100;
    text-align:center;
}

#startTitle{
    margin-top:175px;
    font-size:48px;
    letter-spacing:10px;
}

#startSubtitle{
    margin-top:20px;
    font-size:17px;
    color:#999;
}

#startSmall{
    margin-top:30px;
    font-size:12px;
    color:#555;
}

</style>
</head>

<body>

<div id="cabinet">

<div id="tv">

<div id="picture">

<canvas id="game"
width="960"
height="540"></canvas>

<div id="scanlines"></div>
<div id="vignette"></div>
<div id="glass"></div>

<div id="static"></div>

<div id="osd">
RETRO TV
<div id="nowPlaying">CH 01</div>
</div>

<div id="interactiveHint">
TAP SCREEN TO PLAY
</div>

</div>

<div id="brand">
RETROVISION
</div>

<div id="channel">
CH 01
</div>

<div id="led"></div>

</div>

<div id="controls">

<span class="button"
onclick="previousScene()">◀</span>

<span class="button"
onclick="togglePause()"
id="pauseButton">PAUSE</span>

<span class="button"
onclick="nextScene()">▶</span>

<span class="button"
onclick="toggleShuffle()"
id="shuffleButton">SHUFFLE ON</span>

<span class="button"
onclick="toggleMode()"
id="modeButton">AUTO TV</span>

</div>

<div id="startScreen"
onclick="startTV()">

<div id="startTitle">
RETRO TV
</div>

<div id="startSubtitle">
TAP TO START
</div>

<div id="startSmall">
24-HOUR PIXEL VIDEO GAME CHANNEL
</div>

</div>

</div>

<script>

/* =====================================================
   CORE
===================================================== */

var canvas =
document.getElementById("game");

var ctx =
canvas.getContext("2d");

var W = 960;
var H = 540;

var scene = 0;
var sceneCount = 10;

var frame = 0;
var phaseFrame = 0;

var paused = false;
var shuffle = true;

var started = false;

var autoTV = true;

var channelTimer = 0;
var channelDuration = 65;

var controlsTimer = null;

var commercialMode = false;
var commercialTimer = 0;

var interactiveMode = false;

var score = 0;

var raf =
window.requestAnimationFrame ||
window.webkitRequestAnimationFrame ||
function(fn){
    return setTimeout(fn,33);
};


/* =====================================================
   TIME OF DAY
===================================================== */

function currentHour(){

    return new Date().getHours();

}

function isNight(){

    var h = currentHour();

    return (
        h >= 20 ||
        h < 6
    );

}


/* =====================================================
   DRAW HELPERS
===================================================== */

function clear(c){

    ctx.fillStyle = c;
    ctx.fillRect(0,0,W,H);

}

function rect(x,y,w,h,c){

    ctx.fillStyle = c;

    ctx.fillRect(
        Math.floor(x),
        Math.floor(y),
        Math.floor(w),
        Math.floor(h)
    );

}

function txt(value,x,y,size,color){

    ctx.fillStyle = color;
    ctx.font = size + "px monospace";

    ctx.fillText(
        value,
        x,
        y
    );

}

function centerText(value,y,size,color){

    ctx.fillStyle = color;
    ctx.font = size + "px monospace";

    var width =
    ctx.measureText(value).width;

    ctx.fillText(
        value,
        (W-width)/2,
        y
    );

}

function rnd(a,b){

    return Math.floor(
        Math.random() *
        (b-a+1)
    ) + a;

}


/* =====================================================
   TITLE CARD
===================================================== */

function titleCard(title,subtitle,color){

    clear("#050505");

    centerText(
        title,
        230,
        42,
        color
    );

    centerText(
        subtitle,
        280,
        17,
        "#aaa"
    );

    centerText(
        "PRESENTED BY RETRO TV",
        420,
        13,
        "#555"
    );

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(title){

    clear("#080808");

    centerText(
        "GAME OVER",
        235,
        46,
        "#ff4d6d"
    );

    centerText(
        title,
        285,
        18,
        "#fff"
    );

    centerText(
        "HIGH SCORE  025840",
        350,
        17,
        "#fee440"
    );

    centerText(
        "PRESS START",
        430,
        15,
        "#777"
    );

}


/* =====================================================
   SCENE PHASE
===================================================== */

function phase(){

    var seconds =
    Math.floor(
        phaseFrame / 30
    );

    if(seconds < 5)
        return 0;

    if(seconds < 35)
        return 1;

    if(seconds < 50)
        return 2;

    return 3;

}


/* =====================================================
   CHANNEL 1
   PLATFORM KINGDOM
===================================================== */

function platform(){

    var p = phase();

    if(p===0){

        titleCard(
            "PIXEL KINGDOM",
            "WORLD 1-1",
            "#5bc0eb"
        );

        return;
    }

    if(p===3){

        gameOver(
            "PIXEL KINGDOM"
        );

        return;
    }

    clear("#58bde8");

    var cx =
    (frame*1.2)%1150;

    rect(
        900-cx,
        80,
        150,
        28,
        "#fff"
    );

    rect(
        940-cx,
        53,
        65,
        35,
        "#fff"
    );

    rect(
        0,
        350,
        W,
        190,
        "#439c70"
    );

    rect(
        0,
        445,
        W,
        95,
        "#754321"
    );

    rect(
        0,
        445,
        W,
        18,
        "#91c83e"
    );

    var i;

    for(i=0;i<13;i++){

        rect(
            i*80,
            380,
            55,
            35,
            "#c96522"
        );

    }

    var px =
    (frame*2.8)%1080-80;

    var jump =
    Math.abs(
        Math.sin(frame/18)
    )*75;

    rect(
        px,
        402-jump,
        30,
        31,
        "#ef233c"
    );

    rect(
        px+5,
        433-jump,
        22,
        25,
        "#185adb"
    );

    if(p===2){

        rect(
            760,
            300,
            110,
            110,
            "#5a189a"
        );

        rect(
            785,
            260,
            60,
            50,
            "#7b2cbf"
        );

        txt(
            "BOSS!",
            765,
            235,
            20,
            "#fff"
        );

    }

    txt(
        "WORLD 1-3",
        25,
        35,
        17,
        "#fff"
    );

}


/* =====================================================
   CHANNEL 2
   SPACE DEFENDER
===================================================== */

var stars=[];

function makeStars(){

    var i;

    for(i=0;i<80;i++){

        stars.push({
            x:rnd(0,W),
            y:rnd(0,H),
            s:rnd(1,4)
        });

    }

}

function space(){

    var p = phase();

    if(p===0){

        titleCard(
            "STAR DEFENDER",
            "THE GALAXY NEEDS YOU",
            "#00f5d4"
        );

        return;
    }

    if(p===3){

        gameOver(
            "STAR DEFENDER"
        );

        return;
    }

    clear("#010108");

    var i;

    for(i=0;i<stars.length;i++){

        stars[i].y += stars[i].s;

        if(stars[i].y>H){

            stars[i].y=0;
            stars[i].x=rnd(0,W);

        }

        rect(
            stars[i].x,
            stars[i].y,
            stars[i].s,
            stars[i].s*2,
            "#fff"
        );

    }

    var sx =
    430 +
    Math.sin(frame/28)*210;

    rect(
        sx,
        450,
        80,
        22,
        "#00f5d4"
    );

    rect(
        sx+27,
        425,
        26,
        55,
        "#00bbf9"
    );

    if(frame%30<15){

        rect(
            sx+39,
            250,
            4,
            175,
            "#ffe600"
        );

    }

    if(p===1){

        for(i=0;i<6;i++){

            var ex =
            120+i*135+
            Math.sin(frame/16+i)*35;

            var ey =
            100+
            Math.sin(frame/12+i)*20;

            rect(
                ex,
                ey,
                42,
                24,
                "#ff006e"
            );

        }

    }

    if(p===2){

        rect(
            370,
            90,
            220,
            90,
            "#6a0dad"
        );

        rect(
            405,
            180,
            40,
            40,
            "#ff006e"
        );

        rect(
            515,
            180,
            40,
            40,
            "#ff006e"
        );

        centerText(
            "MOTHERSHIP",
            65,
            18,
            "#fff"
        );

    }

}


/* =====================================================
   CHANNEL 3
   NEON RACER
===================================================== */

function racer(){

    var p = phase();

    if(p===0){

        titleCard(
            "NEON HIGHWAY",
            "MIDNIGHT RUN",
            "#ff006e"
        );

        return;
    }

    if(p===3){

        clear("#10002b");

        centerText(
            "FINISH",
            250,
            48,
            "#00f5d4"
        );

        centerText(
            "1ST PLACE",
            315,
            30,
            "#ff006e"
        );

        return;
    }

    clear("#10002b");

    ctx.fillStyle="#ff4d6d";

    ctx.beginPath();

    ctx.arc(
        480,
        195,
        90,
        0,
        Math.PI*2
    );

    ctx.fill();

    rect(
        0,
        280,
        W,
        260,
        "#03001c"
    );

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.moveTo(390,280);
    ctx.lineTo(570,280);
    ctx.lineTo(840,540);
    ctx.lineTo(120,540);
    ctx.closePath();
    ctx.fill();

    var offset =
    (frame*12)%120;

    var i;

    for(i=0;i<6;i++){

        var y =
        300+i*60+offset;

        var size =
        (y-260)/7;

        rect(
            480-size/2,
            y,
            size,
            20,
            "#fff"
        );

    }

    rect(
        400,
        420,
        160,
        58,
        "#ff006e"
    );

    rect(
        430,
        386,
        100,
        42,
        "#7209b7"
    );

    if(p===2){

        rect(
            640,
            340,
            120,
            50,
            "#00bbf9"
        );

        txt(
            "RIVAL",
            660,
            330,
            16,
            "#fff"
        );

    }

}


/* =====================================================
   CHANNEL 4
   DUNGEON QUEST
===================================================== */

function dungeon(){

    var p = phase();

    if(p===0){

        titleCard(
            "DUNGEON QUEST",
            "FLOOR VII",
            "#d8f3dc"
        );

        return;
    }

    if(p===3){

        clear("#13171a");

        centerText(
            "TREASURE FOUND",
            250,
            34,
            "#ffd166"
        );

        centerText(
            "+ 5000 GOLD",
            310,
            22,
            "#fff"
        );

        return;
    }

    clear("#13171a");

    var x;
    var y;

    for(y=0;y<8;y++){

        for(x=0;x<13;x++){

            if((x+y)%2===0){

                rect(
                    x*80,
                    y*70,
                    80,
                    70,
                    "#1e2428"
                );

            }

        }

    }

    var hx =
    430+
    Math.sin(frame/25)*55;

    rect(
        hx,
        340,
        45,
        70,
        "#4361ee"
    );

    rect(
        hx+8,
        305,
        30,
        38,
        "#f2cc8f"
    );

    if(p===1){

        var slime =
        680+
        Math.sin(frame/15)*35;

        rect(
            slime,
            370,
            65,
            38,
            "#70e000"
        );

    }

    if(p===2){

        rect(
            680,
            250,
            120,
            160,
            "#8b0000"
        );

        rect(
            700,
            210,
            80,
            50,
            "#b22222"
        );

        txt(
            "DRAGON LORD",
            650,
            190,
            18,
            "#fff"
        );

    }

}


/* =====================================================
   CHANNEL 5
   STREET BATTLE
===================================================== */

function fighter(){

    var p=phase();

    if(p===0){

        titleCard(
            "STREET BATTLE",
            "ROUND 2",
            "#f7b267"
        );

        return;
    }

    if(p===3){

        clear("#111");

        centerText(
            "K.O.",
            250,
            70,
            "#ff595e"
        );

        centerText(
            "PLAYER 1 WINS",
            330,
            24,
            "#fff"
        );

        return;
    }

    clear("#ee9b58");

    rect(
        0,
        275,
        W,
        265,
        "#3d3d3d"
    );

    var punch =
    Math.sin(frame/10)*20;

    rect(
        220,
        330,
        55,
        115,
        "#277da1"
    );

    rect(
        230,
        295,
        35,
        40,
        "#f2cc8f"
    );

    rect(
        270,
        350,
        70+punch,
        20,
        "#277da1"
    );

    rect(
        700,
        330,
        55,
        115,
        "#d90429"
    );

    rect(
        710,
        295,
        35,
        40,
        "#f2cc8f"
    );

    rect(
        640-punch,
        350,
        70+punch,
        20,
        "#d90429"
    );

    if(p===2){

        centerText(
            "FINAL ROUND",
            110,
            22,
            "#fff"
        );

    }

}


/* =====================================================
   CHANNEL 6
   BLOCK DROP
===================================================== */

function blocks(){

    var p=phase();

    if(p===0){

        titleCard(
            "BLOCK DROP",
            "CLEAR THE LINES",
            "#00f5d4"
        );

        return;
    }

    if(p===3){

        gameOver(
            "BLOCK DROP"
        );

        return;
    }

    clear("#070707");

    rect(
        315,
        25,
        330,
        495,
        "#111"
    );

    var colors=[
        "#00bbf9",
        "#f15bb5",
        "#fee440",
        "#00f5d4",
        "#9b5de5"
    ];

    var x;
    var y;

    for(y=9;y<15;y++){

        for(x=1;x<10;x++){

            if((x+y)%3!==0){

                rect(
                    325+x*30,
                    40+y*30,
                    28,
                    28,
                    colors[
                        (x+y)%5
                    ]
                );

            }

        }

    }

    var fy =
    ((frame*2)%380)+35;

    rect(
        465,
        fy,
        28,
        28,
        "#00f5d4"
    );

    rect(
        495,
        fy,
        28,
        28,
        "#00f5d4"
    );

    rect(
        525,
        fy,
        28,
        28,
        "#00f5d4"
    );

    if(p===2){

        centerText(
            "LEVEL UP!",
            100,
            24,
            "#fee440"
        );

    }

}


/* =====================================================
   CHANNEL 7
   PIXEL ISLAND
===================================================== */

function ocean(){

    var p=phase();

    if(p===0){

        titleCard(
            "PIXEL ISLAND",
            "ADVENTURE AWAITS",
            "#72d6e8"
        );

        return;
    }

    clear("#72d6e8");

    ctx.fillStyle="#ffe66d";

    ctx.beginPath();

    ctx.arc(
        780,
        100,
        55,
        0,
        Math.PI*2
    );

    ctx.fill();

    rect(
        0,
        240,
        W,
        300,
        "#0077b6"
    );

    rect(
        80,
        355,
        220,
        80,
        "#d4a373"
    );

    rect(
        150,
        255,
        20,
        110,
        "#6b4423"
    );

    rect(
        90,
        230,
        150,
        45,
        "#52b788"
    );

    var boatX =
    (frame*1.5)%1200-150;

    rect(
        boatX,
        350+
        Math.sin(frame/12)*6,
        110,
        30,
        "#fff"
    );

    if(p===2){

        rect(
            650,
            330,
            80,
            65,
            "#8b4513"
        );

        txt(
            "TREASURE!",
            620,
            310,
            18,
            "#fff"
        );

    }

}


/* =====================================================
   CHANNEL 8
   MIDNIGHT CITY
===================================================== */

function city(){

    var p=phase();

    if(p===0){

        titleCard(
            "MIDNIGHT CITY",
            "AFTER DARK",
            "#f15bb5"
        );

        return;
    }

    clear("#09001a");

    ctx.fillStyle="#e0e1dd";

    ctx.beginPath();

    ctx.arc(
        780,
        100,
        45,
        0,
        Math.PI*2
    );

    ctx.fill();

    var i;

    for(i=0;i<12;i++){

        var bh =
        130+
        (i%5)*35;

        rect(
            i*90,
            500-bh,
            72,
            bh,
            "#15152c"
        );

    }

    rect(
        0,
        470,
        W,
        70,
        "#111"
    );

    var car =
    (frame*4)%1100-100;

    rect(
        car,
        480,
        90,
        30,
        "#ff006e"
    );

    if(p===2){

        centerText(
            "NIGHT DRIVE",
            110,
            24,
            "#00f5d4"
        );

    }

}


/* =====================================================
   CHANNEL 9
   PIXEL TENNIS
===================================================== */

function tennis(){

    var p=phase();

    if(p===0){

        titleCard(
            "PIXEL TENNIS",
            "CHAMPIONSHIP MATCH",
            "#7ae582"
        );

        return;
    }

    if(p===3){

        clear("#1b4332");

        centerText(
            "GAME SET MATCH",
            250,
            36,
            "#fff"
        );

        centerText(
            "PLAYER 1",
            320,
            26,
            "#fee440"
        );

        return;
    }

    clear("#1b4332");

    rect(
        80,
        70,
        800,
        400,
        "#40916c"
    );

    ctx.strokeStyle="#fff";
    ctx.lineWidth=5;

    ctx.strokeRect(
        80,
        70,
        800,
        400
    );

    ctx.beginPath();

    ctx.moveTo(
        480,
        70
    );

    ctx.lineTo(
        480,
        470
    );

    ctx.stroke();

    rect(
        450,
        220,
        60,
        4,
        "#fff"
    );

    var ballX =
    480+
    Math.sin(frame/15)*330;

    var ballY =
    270+
    Math.sin(frame/9)*120;

    rect(
        ballX,
        ballY,
        12,
        12,
        "#fee440"
    );

    rect(
        180,
        270+
        Math.sin(frame/15)*100,
        20,
        60,
        "#277da1"
    );

    rect(
        760,
        270-
        Math.sin(frame/15)*100,
        20,
        60,
        "#d90429"
    );

    if(p===2){

        centerText(
            "MATCH POINT",
            50,
            20,
            "#fff"
        );

    }

}


/* =====================================================
   CHANNEL 10
   CYBER BREAKOUT
===================================================== */

function breakout(){

    var p=phase();

    if(p===0){

        titleCard(
            "CYBER BREAKOUT",
            "DESTROY THE GRID",
            "#00f5d4"
        );

        return;
    }

    if(p===3){

        clear("#050505");

        centerText(
            "STAGE CLEAR",
            250,
            40,
            "#00f5d4"
        );

        centerText(
            "BONUS +5000",
            320,
            20,
            "#fee440"
        );

        return;
    }

    clear("#050505");

    var colors=[
        "#ff006e",
        "#8338ec",
        "#3a86ff",
        "#00f5d4"
    ];

    var x;
    var y;

    for(y=0;y<5;y++){

        for(x=0;x<10;x++){

            if(
                (x+y+
                Math.floor(frame/120))
                %6!==0
            ){

                rect(
                    85+x*80,
                    60+y*35,
                    68,
                    24,
                    colors[y%4]
                );

            }

        }

    }

    var paddleX =
    400+
    Math.sin(frame/20)*250;

    rect(
        paddleX,
        475,
        120,
        18,
        "#fff"
    );

    var bx =
    480+
    Math.sin(frame/13)*350;

    var by =
    300+
    Math.sin(frame/9)*170;

    rect(
        bx,
        by,
        15,
        15,
        "#fee440"
    );

}


/* =====================================================
   COMMERCIALS
===================================================== */

var ads = [
    {
        title:"TURBO SODA",
        sub:"POWER UP YOUR DAY",
        color:"#ff006e"
    },
    {
        title:"MEGA BYTE",
        sub:"THE SNACK OF CHAMPIONS",

    },
    {

/* =====================================================
   STATION ID
===================================================== */

function stationID(){

    clear("#020202");

    centerText(
        "RETRO TV",
        240,
        60,
        "#fff"
    );

    centerText(
        "ALL GAMES · ALL DAY",
        305,

/* =====================================================
   DRAW LOOP
===================================================== */

function draw(){

    if(
        started &&
        !paused
    ){

        frame++;
        phaseFrame++;

        if(commercialMode){

            commercial();

        }

        else{

            if(scene===0)platform();
            if(scene===1)space();
            if(scene===2)racer();
            if(scene===3)dungeon();
            if(scene===4)fighter();
            if(scene===5)blocks();
            if(scene===6)ocean();
            if(scene===7)city();
            if(scene===8)tennis();
            if(scene===9)breakout();

        }

    }

    raf(draw);

}


/* =====================================================
   NAMES
===================================================== */

var names=[
    "PIXEL KINGDOM",
    "STAR DEFENDER",
    "NEON HIGHWAY",
    "DUNGEON QUEST",
    "STREET BATTLE",
    "BLOCK DROP",
    "PIXEL ISLAND",
    "MIDNIGHT CITY",
    "PIXEL TENNIS",
    "CYBER BREAKOUT"
];


/* =====================================================
   CHANNEL SELECTION
===================================================== */

function allowedScene(){

    if(isNight()){

        var nightScenes=[
            1,2,3,7,9
        ];

        return nightScenes[
            rnd(
                0,
                nightScenes.length-1
            )
        ];

    }

    return rnd(
        0,
        sceneCount-1
    );

}

function updateChannel(){

    var number=scene+1;

    var display=
    number<10 ?
    "0"+number :
    number;

    document.getElementById(
        "channel"
    ).innerHTML=
    "CH "+display;

    document.getElementById(
        "nowPlaying"
    ).innerHTML=
    "CH "+display+
    " · "+
    names[scene];

}


/* =====================================================
   CHANNEL STATIC
===================================================== */

function channelStatic(){

    var box=
    document.getElementById(
        "static"
    );

    box.style.display=
    "block";

    setTimeout(
        function(){

            box.style.display=
            "none";

        },
        160
    );

}


/* =====================================================
   NEXT CHANNEL
===================================================== */

function nextScene(){

    channelStatic();

    commercialMode=false;
    commercialTimer=0;

    if(shuffle){

        var old=scene;

        while(scene===old){

            scene=
            allowedScene();

        }

    }

    else{

        scene++;

        if(scene>=sceneCount){

            scene=0;

        }

    }

    frame=0;
    phaseFrame=0;
    channelTimer=0;

    updateChannel();

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousScene(){

    channelStatic();

    commercialMode=false;

    scene--;

    if(scene<0){

        scene=
        sceneCount-1;

    }

    frame=0;
    phaseFrame=0;
    channelTimer=0;

    updateChannel();

}


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

    paused=!paused;

    document.getElementById(
        "pauseButton"
    ).innerHTML=
    paused ?
    "PLAY" :
    "PAUSE";

}


/* =====================================================
   SHUFFLE
===================================================== */

function toggleShuffle(){

    shuffle=!shuffle;

    document.getElementById(
        "shuffleButton"
    ).innerHTML=
    shuffle ?
    "SHUFFLE ON" :
    "SHUFFLE OFF";

}


/* =====================================================
   TV MODE
===================================================== */

function toggleMode(){

    autoTV=!autoTV;

    document.getElementById(
        "modeButton"
    ).innerHTML=
    autoTV ?
    "AUTO TV" :
    "MANUAL";

}


/* =====================================================
   AUTO PROGRAMMING
===================================================== */

function secondTimer(){

    if(
        !started ||
        paused
    ){

        return;

    }

    if(commercialMode){

        commercialTimer++;

        if(
            commercialTimer>=9
        ){

            commercialMode=false;

            nextScene();

        }

        return;

    }

    if(!autoTV){

        return;

    }

    channelTimer++;

    if(
        channelTimer>=channelDuration
    ){

        channelTimer=0;

        /* about every third change,
           run a fake ad break */

        if(
            rnd(1,3)===1
        ){

            commercialMode=true;
            commercialTimer=0;

        }

        else{

            nextScene();

        }

    }

}


/* =====================================================
   HIDDEN INTERACTIVE MODE
===================================================== */

function screenTap(event){

    if(!started){

        return;

    }

    if(
        event.target &&
        event.target.className==="button"
    ){

        return;

    }

    if(commercialMode){

        return;

    }

    interactiveMode=true;

    score++;

    /* small scene-specific reaction */

    if(scene===0){

        frame += 18;

    }

    if(scene===1){

        frame += 12;

    }

    if(scene===2){

        frame += 20;

    }

    if(scene===3){

        phaseFrame += 15;

    }

    if(scene===4){

        frame += 10;

    }

    if(scene===5){

        frame += 25;

    }

    if(scene===8){

        frame += 20;

    }

    if(scene===9){

        frame += 15;

    }

    document.getElementById(
        "interactiveHint"
    ).style.display=
    "block";

    setTimeout(
        function(){

            document.getElementById(
                "interactiveHint"
            ).style.display=
            "none";

        },
        1200
    );

}


/* =====================================================
   CONTROLS
===================================================== */

function showControls(){

    var controls=
    document.getElementById(
        "controls"
    );

    controls.style.opacity="1";

    if(controlsTimer){

        clearTimeout(
            controlsTimer
        );

    }

    controlsTimer=
    setTimeout(
        function(){

            controls.style.opacity="0";

        },
        3500
    );

}


document.addEventListener(
    "touchstart",
    showControls,
    false
);

document.addEventListener(
    "click",
    showControls,
    false
);

document.getElementById(
    "picture"
).addEventListener(
    "click",
    screenTap,
    false
);


/* =====================================================
   START
===================================================== */

function startTV(){

    if(started){

        return;

    }

    started=true;

    document.getElementById(
        "startScreen"
    ).style.display="none";

}


/* =====================================================
   INIT
===================================================== */

function init(){

    makeStars();

    /* start with night-appropriate
       programming after 8 PM */

    if(isNight()){

        scene=
        allowedScene();

    }

    updateChannel();

    setInterval(
        secondTimer,
        1000
    );

    draw();

}

init();

</script>
