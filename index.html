<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Retro TV Arcade</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:monospace;
    -webkit-user-select:none;
    user-select:none;
}

#cabinet{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#070707;
}

#tv{
    position:absolute;
    left:3%;
    top:2%;
    width:94%;
    height:89%;
    background:#171717;
    border-radius:24px;

    box-shadow:
        inset 0 0 0 4px #303030,
        inset 0 0 0 10px #090909,
        0 8px 25px rgba(0,0,0,.9);
}

#picture{
    position:absolute;
    left:2.2%;
    top:3%;
    width:95.6%;
    height:88%;
    background:#000;
    border-radius:17px;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:pixelated;
}

#scanlines{
    pointer-events:none;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:20;

    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 2px,
        rgba(0,0,0,.25) 3px,
        rgba(0,0,0,.25) 4px
    );
}

#vignette{
    pointer-events:none;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:21;

    box-shadow:
        inset 0 0 90px rgba(0,0,0,.85);
}

#glass{
    pointer-events:none;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:22;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.05),
            rgba(255,255,255,0) 22%
        );
}

#osd{
    position:absolute;
    left:22px;
    top:18px;
    z-index:30;
    color:#fff;
    font-size:16px;
    text-shadow:2px 2px #000;
    opacity:.8;
}

#nowPlaying{
    margin-top:4px;
    font-size:12px;
    color:#c5c5c5;
}

#brand{
    position:absolute;
    left:30px;
    bottom:17px;
    color:#6f6f6f;
    letter-spacing:3px;
    font-size:12px;
}

#channel{
    position:absolute;
    right:28px;
    bottom:16px;
    color:#6f6f6f;
    font-size:12px;
}

#led{
    position:absolute;
    right:14px;
    bottom:18px;
    width:7px;
    height:7px;
    border-radius:8px;
    background:#00d26a;
    box-shadow:0 0 8px #00d26a;
}

#controls{
    position:absolute;
    left:50%;
    bottom:20px;
    width:680px;
    margin-left:-340px;
    text-align:center;
    z-index:50;
    padding:10px 0;
    border-radius:13px;
    background:rgba(0,0,0,.82);
    opacity:0;
}

.button{
    display:inline-block;
    padding:11px 15px;
    margin:0 4px;
    min-width:55px;
    color:#fff;
    background:#252525;
    border:1px solid #555;
    border-radius:8px;
    font-size:13px;
}

.button:active{
    background:#777;
}

#static{
    display:none;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:35;

    background:
    repeating-linear-gradient(
        0deg,
        #111 0px,
        #999 1px,
        #222 2px,
        #777 3px,
        #000 4px
    );

    opacity:.85;
}

#arcadeOverlay{
    display:none;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:33;
    pointer-events:none;
}

#arcadeTitle{
    position:absolute;
    top:20px;
    left:0;
    width:100%;
    text-align:center;
    color:#fff;
    font-size:20px;
    letter-spacing:3px;
    text-shadow:2px 2px #000;
}

#arcadeInfo{
    position:absolute;
    bottom:15px;
    left:0;
    width:100%;
    text-align:center;
    color:#fff;
    font-size:13px;
    text-shadow:2px 2px #000;
}

#startScreen{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    z-index:100;
    text-align:center;
}

#startTitle{
    margin-top:175px;
    font-size:48px;
    letter-spacing:10px;
}

#startSubtitle{
    margin-top:20px;
    font-size:17px;
    color:#999;
}

#startSmall{
    margin-top:30px;
    font-size:12px;
    color:#555;
}

</style>
</head>

<body>

<div id="cabinet">

<div id="tv">

<div id="picture">

<canvas id="game"
width="960"
height="540"></canvas>

<div id="scanlines"></div>
<div id="vignette"></div>
<div id="glass"></div>

<div id="static"></div>

<div id="osd">
RETRO TV
<div id="nowPlaying">CH 01</div>
</div>

<div id="arcadeOverlay">

<div id="arcadeTitle">
SECRET ARCADE
</div>

<div id="arcadeInfo">
30 SECONDS
</div>

</div>

</div>

<div id="brand">
RETROVISION
</div>

<div id="channel">
CH 01
</div>

<div id="led"></div>

</div>

<div id="controls">

<span class="button"
onclick="previousScene()">◀</span>

<span class="button"
onclick="togglePause()"
id="pauseButton">PAUSE</span>

<span class="button"
onclick="nextScene()">▶</span>

<span class="button"
onclick="toggleShuffle()"
id="shuffleButton">SHUFFLE ON</span>

<span class="button"
onclick="toggleMode()"
id="modeButton">AUTO TV</span>

<span class="button"
onclick="tryArcade()">
PLAY
</span>

</div>

<div id="startScreen"
onclick="startTV()">

<div id="startTitle">
RETRO TV
</div>

<div id="startSubtitle">
TAP TO START
</div>

<div id="startSmall">
RETRO TV + SECRET ARCADE
</div>

</div>

</div>

<script>

/* =====================================================
   CORE
===================================================== */

var canvas =
document.getElementById("game");

var ctx =
canvas.getContext("2d");

var W=960;
var H=540;

var scene=0;
var sceneCount=10;

var frame=0;
var phaseFrame=0;

var paused=false;
var started=false;

var shuffle=true;
var autoTV=true;

var channelTimer=0;
var channelDuration=60;

var commercialMode=false;
var commercialTimer=0;

var controlsTimer=null;


/* =====================================================
   SECRET ARCADE
===================================================== */

var arcade=false;
var arcadeSeconds=30;

var arcadeTimer=0;

var score=0;

var pointerX=480;
var pointerY=270;


/* STAR DEFENDER */

var shipX=440;

var bullets=[];

var enemies=[];


/* TENNIS */

var tennisPaddleY=220;

var tennisBallX=480;
var tennisBallY=270;

var tennisDX=6;
var tennisDY=4;


/* BREAKOUT */

var breakoutPaddleX=400;

var breakoutBallX=480;
var breakoutBallY=270;

var breakoutDX=5;
var breakoutDY=-5;


/* BLOCK DROP */

var blockX=4;
var blockY=0;
var blockRotation=0;


/* =====================================================
   ANIMATION
===================================================== */

var raf=
window.requestAnimationFrame ||
window.webkitRequestAnimationFrame ||
function(fn){

    return setTimeout(fn,33);

};


/* =====================================================
   HELPERS
===================================================== */

function clear(c){

    ctx.fillStyle=c;
    ctx.fillRect(0,0,W,H);

}

function rect(x,y,w,h,c){

    ctx.fillStyle=c;

    ctx.fillRect(
        Math.floor(x),
        Math.floor(y),
        Math.floor(w),
        Math.floor(h)
    );

}

function txt(v,x,y,size,color){

    ctx.fillStyle=color;
    ctx.font=size+"px monospace";

    ctx.fillText(v,x,y);

}

function centerText(v,y,size,color){

    ctx.fillStyle=color;
    ctx.font=size+"px monospace";

    var width=
    ctx.measureText(v).width;

    ctx.fillText(
        v,
        (W-width)/2,
        y
    );

}

function rnd(a,b){

    return Math.floor(
        Math.random()*
        (b-a+1)
    )+a;

}


/* =====================================================
   PASSIVE TV SCENES
===================================================== */

var names=[
"PIXEL KINGDOM",
"STAR DEFENDER",
"NEON HIGHWAY",
"DUNGEON QUEST",
"STREET BATTLE",
"BLOCK DROP",
"PIXEL ISLAND",
"MIDNIGHT CITY",
"PIXEL TENNIS",
"CYBER BREAKOUT"
];


function titleCard(title,sub,color){

    clear("#050505");

    centerText(
        title,
        230,
        42,
        color
    );

    centerText(
        sub,
        280,
        17,
        "#aaa"
    );

    centerText(
        "RETRO TV PRESENTS",
        420,
        13,
        "#555"
    );

}


function platform(){

    clear("#58bde8");

    rect(
        0,
        350,
        W,
        190,
        "#439c70"
    );

    rect(
        0,
        445,
        W,
        95,
        "#754321"
    );

    rect(
        0,
        445,
        W,
        18,
        "#91c83e"
    );

    var px=
    (frame*2.8)%1080-80;

    var jump=
    Math.abs(
        Math.sin(frame/18)
    )*75;

    rect(
        px,
        402-jump,
        30,
        31,
        "#ef233c"
    );

    rect(
        px+5,
        433-jump,
        22,
        25,
        "#185adb"
    );

    txt(
        "PIXEL KINGDOM",
        25,
        35,
        17,
        "#fff"
    );

}


function passiveSpace(){

    clear("#010108");

    var i;

    for(i=0;i<60;i++){

        var sx=
        (i*137)%W;

        var sy=
        (
            i*83+
            frame*2
        )%H;

        rect(
            sx,
            sy,
            2,
            4,
            "#fff"
        );

    }

    var ship=
    430+
    Math.sin(frame/28)*210;

    rect(
        ship,
        450,
        80,
        22,
        "#00f5d4"
    );

    rect(
        ship+27,
        425,
        26,
        55,
        "#00bbf9"
    );

    for(i=0;i<6;i++){

        var ex=
        120+i*135+
        Math.sin(frame/16+i)*35;

        rect(
            ex,
            120,
            42,
            24,
            "#ff006e"
        );

    }

}


function racer(){

    clear("#10002b");

    ctx.fillStyle="#ff4d6d";

    ctx.beginPath();

    ctx.arc(
        480,
        195,
        90,
        0,
        Math.PI*2
    );

    ctx.fill();

    rect(
        0,
        280,
        W,
        260,
        "#03001c"
    );

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.moveTo(390,280);
    ctx.lineTo(570,280);
    ctx.lineTo(840,540);
    ctx.lineTo(120,540);

    ctx.closePath();
    ctx.fill();

    rect(
        400,
        420,
        160,
        58,
        "#ff006e"
    );

    rect(
        430,
        386,
        100,
        42,
        "#7209b7"
    );

}


function dungeon(){

    clear("#13171a");

    var hx=
    430+
    Math.sin(frame/25)*55;

    rect(
        hx,
        340,
        45,
        70,
        "#4361ee"
    );

    rect(
        hx+8,
        305,
        30,
        38,
        "#f2cc8f"
    );

    var slime=
    680+
    Math.sin(frame/15)*35;

    rect(
        slime,
        370,
        65,
        38,
        "#70e000"
    );

    txt(
        "DUNGEON QUEST",
        25,
        35,
        17,
        "#fff"
    );

}


function fighter(){

    clear("#ee9b58");

    rect(
        0,
        275,
        W,
        265,
        "#3d3d3d"
    );

    var punch=
    Math.sin(frame/10)*20;

    rect(
        220,
        330,
        55,
        115,
        "#277da1"
    );

    rect(
        270,
        350,
        70+punch,
        20,
        "#277da1"
    );

    rect(
        700,
        330,
        55,
        115,
        "#d90429"
    );

    rect(
        640-punch,
        350,
        70+punch,
        20,
        "#d90429"
    );

}


function passiveBlocks(){

    clear("#070707");

    rect(
        315,
        25,
        330,
        495,
        "#111"
    );

    var colors=[
        "#00bbf9",
        "#f15bb5",
        "#fee440",
        "#00f5d4"
    ];

    var x;
    var y;

    for(y=9;y<15;y++){

        for(x=1;x<10;x++){

            if((x+y)%3!==0){

                rect(
                    325+x*30,
                    40+y*30,
                    28,
                    28,
                    colors[
                        (x+y)%4
                    ]
                );

            }

        }

    }

}


function ocean(){

    clear("#72d6e8");

    rect(
        0,
        240,
        W,
        300,
        "#0077b6"
    );

    rect(
        80,
        355,
        220,
        80,
        "#d4a373"
    );

    var boatX=
    (frame*1.5)%1200-150;

    rect(
        boatX,
        350,
        110,
        30,
        "#fff"
    );

}


function city(){

    clear("#09001a");

    var i;

    for(i=0;i<12;i++){

        var bh=
        130+
        (i%5)*35;

        rect(
            i*90,
            500-bh,
            72,
            bh,
            "#15152c"
        );

    }

    rect(
        0,
        470,
        W,
        70,
        "#111"
    );

    var car=
    (frame*4)%1100-100;

    rect(
        car,
        480,
        90,
        30,
        "#ff006e"
    );

}


function passiveTennis(){

    clear("#1b4332");

    rect(
        80,
        70,
        800,
        400,
        "#40916c"
    );

    ctx.strokeStyle="#fff";
    ctx.lineWidth=4;

    ctx.strokeRect(
        80,
        70,
        800,
        400
    );

    ctx.beginPath();

    ctx.moveTo(
        480,
        70
    );

    ctx.lineTo(
        480,
        470
    );

    ctx.stroke();

    var ballX=
    480+
    Math.sin(frame/15)*330;

    var ballY=
    270+
    Math.sin(frame/9)*120;

    rect(
        ballX,
        ballY,
        12,
        12,
        "#fee440"
    );

}


function passiveBreakout(){

    clear("#050505");

    var colors=[
        "#ff006e",
        "#8338ec",
        "#3a86ff",
        "#00f5d4"
    ];

    var x;
    var y;

    for(y=0;y<5;y++){

        for(x=0;x<10;x++){

            rect(
                85+x*80,
                60+y*35,
                68,
                24,
                colors[y%4]
            );

        }

    }

    var paddle=
    400+
    Math.sin(frame/20)*250;

    rect(
        paddle,
        475,
        120,
        18,
        "#fff"
    );

}


/* =====================================================
   ARCADE: STAR DEFENDER
===================================================== */

function startStarGame(){

    score=0;

    shipX=440;

    bullets=[];

    enemies=[];

    var i;

    for(i=0;i<8;i++){

        enemies.push({

            x:rnd(60,880),
            y:rnd(30,200),
            alive:true

        });

    }

}


function playStar(){

    clear("#010108");

    var i;

    for(i=0;i<60;i++){

        rect(
            (i*137)%W,
            (i*83+frame*3)%H,
            2,
            4,
            "#fff"
        );

    }

    rect(
        shipX,
        455,
        80,
        22,
        "#00f5d4"
    );

    rect(
        shipX+27,
        430,
        26,
        55,
        "#00bbf9"
    );

    for(i=0;i<bullets.length;i++){

        bullets[i].y-=12;

        rect(
            bullets[i].x,
            bullets[i].y,
            5,
            14,
            "#ffe600"
        );

    }

    for(i=0;i<enemies.length;i++){

        if(
            enemies[i].alive
        ){

            rect(
                enemies[i].x,
                enemies[i].y,
                42,
                24,
                "#ff006e"
            );

            var b;

            for(
                b=0;
                b<bullets.length;
                b++
            ){

                if(
                    bullets[b].x >
                    enemies[i].x &&
                    bullets[b].x <
                    enemies[i].x+42 &&
                    bullets[b].y >
                    enemies[i].y &&
                    bullets[b].y <
                    enemies[i].y+24
                ){

                    enemies[i].alive=false;

                    score+=100;

                }

            }

        }

    }

    txt(
        "SCORE "+score,
        25,
        35,
        18,
        "#fff"
    );

}


/* =====================================================
   ARCADE: TENNIS
===================================================== */

function startTennisGame(){

    score=0;

    tennisPaddleY=220;

    tennisBallX=480;
    tennisBallY=270;

    tennisDX=6;
    tennisDY=4;

}


function playTennis(){

    clear("#1b4332");

    rect(
        80,
        70,
        800,
        400,
        "#40916c"
    );

    ctx.strokeStyle="#fff";
    ctx.lineWidth=4;

    ctx.strokeRect(
        80,
        70,
        800,
        400
    );

    ctx.beginPath();

    ctx.moveTo(
        480,
        70
    );

    ctx.lineTo(
        480,
        470
    );

    ctx.stroke();

    tennisBallX+=tennisDX;
    tennisBallY+=tennisDY;

    if(
        tennisBallY<80 ||
        tennisBallY>450
    ){

        tennisDY=
        -tennisDY;

    }

    if(
        tennisBallX>850
    ){

        tennisDX=
        -tennisDX;

    }

    if(
        tennisBallX<115
    ){

        if(
            tennisBallY >
            tennisPaddleY &&
            tennisBallY <
            tennisPaddleY+110
        ){

            tennisDX=
            Math.abs(
                tennisDX
            );

            score++;

        }

        else{

            tennisBallX=480;
            tennisBallY=270;

            score=0;

        }

    }

    rect(
        100,
        tennisPaddleY,
        18,
        110,
        "#277da1"
    );

    rect(
        tennisBallX,
        tennisBallY,
        12,
        12,
        "#fee440"
    );

    txt(
        "RALLY "+score,
        25,
        35,
        18,
        "#fff"
    );

}


/* =====================================================
   ARCADE: BREAKOUT
===================================================== */

function startBreakoutGame(){

    score=0;

    breakoutPaddleX=400;

    breakoutBallX=480;
    breakoutBallY=300;

    breakoutDX=5;
    breakoutDY=-5;

}


function playBreakout(){

    clear("#050505");

    var colors=[
        "#ff006e",
        "#8338ec",
        "#3a86ff",
        "#00f5d4"
    ];

    var x;
    var y;

    for(y=0;y<5;y++){

        for(x=0;x<10;x++){

            rect(
                85+x*80,
                60+y*35,
                68,
                24,
                colors[y%4]
            );

        }

    }

    breakoutBallX+=
    breakoutDX;

    breakoutBallY+=
    breakoutDY;

    if(
        breakoutBallX<15 ||
        breakoutBallX>945
    ){

        breakoutDX=
        -breakoutDX;

    }

    if(
        breakoutBallY<30
    ){

        breakoutDY=
        Math.abs(
            breakoutDY
        );

    }

    if(
        breakoutBallY>460 &&
        breakoutBallY<500 &&
        breakoutBallX >
        breakoutPaddleX &&
        breakoutBallX <
        breakoutPaddleX+140
    ){

        breakoutDY=
        -Math.abs(
            breakoutDY
        );

        score++;

    }

    if(
        breakoutBallY>540
    ){

        breakoutBallX=480;
        breakoutBallY=260;

        score=0;

    }

    rect(
        breakoutPaddleX,
        475,
        140,
        18,
        "#fff"
    );

    rect(
        breakoutBallX,
        breakoutBallY,
        14,
        14,
        "#fee440"
    );

    txt(
        "SCORE "+score,
        25,
        35,
        18,
        "#fff"
    );

}


/* =====================================================
   ARCADE: BLOCK DROP
===================================================== */

function startBlockGame(){

    score=0;

    blockX=4;
    blockY=0;

    blockRotation=0;

}


function playBlocks(){

    clear("#070707");

    rect(
        315,
        25,
        330,
        495,
        "#111"
    );

    blockY+=0.06;

    if(
        blockY>14
    ){

        blockY=0;

        score++;

    }

    var px=
    325+
    blockX*30;

    var py=
    40+
    blockY*30;

    rect(
        px,
        py,
        28,
        28,
        "#00f5d4"
    );

    rect(
        px+30,
        py,
        28,
        28,
        "#00f5d4"
    );

    if(
        blockRotation===0
    ){

        rect(
            px+60,
            py,
            28,
            28,
            "#00f5d4"
        );

        rect(
            px+30,
            py-30,
            28,
            28,
            "#00f5d4"
        );

    }

    else{

        rect(
            px+30,
            py+30,
            28,
            28,
            "#00f5d4"
        );

        rect(
            px+30,
            py-30,
            28,
            28,
            "#00f5d4"
        );

    }

    txt(
        "LINES "+score,
        90,
        150,
        18,
        "#fff"
    );

}


/* =====================================================
   DRAW LOOP
===================================================== */

function draw(){

    if(
        started &&
        !paused
    ){

        frame++;

        if(arcade){

            if(scene===1)
                playStar();

            else if(scene===5)
                playBlocks();

            else if(scene===8)
                playTennis();

            else if(scene===9)
                playBreakout();

        }

        else if(commercialMode){

            commercial();

        }

        else{

            if(scene===0)platform();

            if(scene===1)
                passiveSpace();

            if(scene===2)racer();

            if(scene===3)dungeon();

            if(scene===4)fighter();

            if(scene===5)
                passiveBlocks();

            if(scene===6)ocean();

            if(scene===7)city();

            if(scene===8)
                passiveTennis();

            if(scene===9)
                passiveBreakout();

        }

    }

    raf(draw);

}


/* =====================================================
   COMMERCIAL
===================================================== */

function commercial(){

    clear("#111");

    centerText(
        "RETRO TV COMMERCIAL",
        90,
        18,
        "#777"
    );

    centerText(
        "TURBO SODA",
        230,
        50,
        "#ff006e"
    );

    centerText(
        "POWER UP YOUR DAY",
        290,
        18,
        "#fff"
    );

    centerText(
        "ONLY 19.99",
        390,
        24,
        "#fee440"
    );

}


/* =====================================================
   ARCADE CONTROL
===================================================== */

function arcadeAvailable(){

    return (
        scene===1 ||
        scene===5 ||
        scene===8 ||
        scene===9
    );

}


function tryArcade(){

    if(
        !arcadeAvailable()
    ){

        document.getElementById(
            "nowPlaying"
        ).innerHTML=
        "NO GAME ON THIS CHANNEL";

        return;

    }

    startArcade();

}


function startArcade(){

    if(arcade)
        return;

    arcade=true;

    arcadeTimer=0;

    channelTimer=0;

    commercialMode=false;

    document.getElementById(
        "arcadeOverlay"
    ).style.display=
    "block";

    if(scene===1)
        startStarGame();

    if(scene===5)
        startBlockGame();

    if(scene===8)
        startTennisGame();

    if(scene===9)
        startBreakoutGame();

    updateArcadeInfo();

}


function stopArcade(){

    arcade=false;

    arcadeTimer=0;

    document.getElementById(
        "arcadeOverlay"
    ).style.display=
    "none";

    updateChannel();

}


function updateArcadeInfo(){

    var remaining=
    arcadeSeconds-
    arcadeTimer;

    document.getElementById(
        "arcadeInfo"
    ).innerHTML=
    remaining+
    " SECONDS · SCORE "+
    score;

}


/* =====================================================
   TOUCH INPUT
===================================================== */

function getCanvasPoint(event){

    var rectBox=
    canvas.getBoundingClientRect();

    var touch=null;

    if(
        event.touches &&
        event.touches.length
    ){

        touch=
        event.touches[0];

    }

    else{

        touch=event;

    }

    pointerX=
    (
        touch.clientX-
        rectBox.left
    ) *
    (
        W/
        rectBox.width
    );

    pointerY=
    (
        touch.clientY-
        rectBox.top
    ) *
    (
        H/
        rectBox.height
    );

}


function arcadeMove(event){

    if(!arcade)
        return;

    getCanvasPoint(event);

    if(scene===1){

        shipX=
        pointerX-40;

        if(shipX<0)
            shipX=0;

        if(shipX>880)
            shipX=880;

    }

    if(scene===8){

        tennisPaddleY=
        pointerY-55;

        if(
            tennisPaddleY<75
        )
            tennisPaddleY=75;

        if(
            tennisPaddleY>355
        )
            tennisPaddleY=355;

    }

    if(scene===9){

        breakoutPaddleX=
        pointerX-70;

        if(
            breakoutPaddleX<0
        )
            breakoutPaddleX=0;

        if(
            breakoutPaddleX>820
        )
            breakoutPaddleX=820;

    }

}


function arcadeTap(event){

    if(!arcade){

        if(
            arcadeAvailable()
        ){

            startArcade();

        }

        return;

    }

    getCanvasPoint(event);

    if(scene===1){

        bullets.push({

            x:shipX+38,
            y:430

        });

    }

    if(scene===5){

        if(
            pointerX <
            W/3
        ){

            blockX--;

            if(blockX<0)
                blockX=0;

        }

        else if(
            pointerX >
            W*2/3
        ){

            blockX++;

            if(blockX>7)
                blockX=7;

        }

        else{

            blockRotation=
            blockRotation===0 ?
            1 :
            0;

        }

    }

}


canvas.addEventListener(
    "touchmove",
    arcadeMove,
    false
);

canvas.addEventListener(
    "touchstart",
    arcadeTap,
    false
);

canvas.addEventListener(
    "click",
    arcadeTap,
    false
);


/* =====================================================
   CHANNELS
===================================================== */

function updateChannel(){

    var n=
    scene+1;

    var d=
    n<10 ?
    "0"+n :
    n;

    document.getElementById(
        "channel"
    ).innerHTML=
    "CH "+d;

    document.getElementById(
        "nowPlaying"
    ).innerHTML=
    "CH "+d+
    " · "+
    names[scene];

}


function channelStatic(){

    var s=
    document.getElementById(
        "static"
    );

    s.style.display=
    "block";

    setTimeout(
        function(){

            s.style.display=
            "none";

        },
        150
    );

}


function nextScene(){

    if(arcade)
        stopArcade();

    channelStatic();

    commercialMode=false;

    var old=scene;

    if(shuffle){

        while(scene===old){

            scene=
            rnd(
                0,
                sceneCount-1
            );

        }

    }

    else{

        scene++;

        if(scene>=sceneCount)
            scene=0;

    }

    frame=0;
    channelTimer=0;

    updateChannel();

}


function previousScene(){

    if(arcade)
        stopArcade();

    scene--;

    if(scene<0)
        scene=sceneCount-1;

    frame=0;
    channelTimer=0;

    updateChannel();

}


/* =====================================================
   TIMER
===================================================== */

function secondTimer(){

    if(
        !started ||
        paused
    )
        return;

    if(arcade){

        arcadeTimer++;

        updateArcadeInfo();

        if(
            arcadeTimer>=
            arcadeSeconds
        ){

            stopArcade();

        }

        return;

    }

    if(commercialMode){

        commercialTimer++;

        if(
            commercialTimer>=8
        ){

            commercialMode=false;

            nextScene();

        }

        return;

    }

    if(!autoTV)
        return;

    channelTimer++;

    if(
        channelTimer>=
        channelDuration
    ){

        channelTimer=0;

        if(
            rnd(1,4)===1
        ){

            commercialMode=true;
            commercialTimer=0;

        }

        else{

            nextScene();

        }

    }

}


/* =====================================================
   SETTINGS
===================================================== */

function togglePause(){

    paused=!paused;

    document.getElementById(
        "pauseButton"
    ).innerHTML=
    paused ?
    "PLAY" :
    "PAUSE";

}


function toggleShuffle(){

    shuffle=!shuffle;

    document.getElementById(
        "shuffleButton"
    ).innerHTML=
    shuffle ?
    "SHUFFLE ON" :
    "SHUFFLE OFF";

}


function toggleMode(){

    autoTV=!autoTV;

    document.getElementById(
        "modeButton"
    ).innerHTML=
    autoTV ?
    "AUTO TV" :
    "MANUAL";

}


/* =====================================================
   CONTROLS
===================================================== */

function showControls(){

    var controls=
    document.getElementById(
        "controls"
    );

    controls.style.opacity=
    "1";

    if(controlsTimer){

        clearTimeout(
            controlsTimer
        );

    }

    controlsTimer=
    setTimeout(
        function(){

            controls.style.opacity=
            "0";

        },
        3500
    );

}


document.addEventListener(
    "touchstart",
    showControls,
    false
);

document.addEventListener(
    "click",
    showControls,
    false
);


/* =====================================================
   START
===================================================== */

function startTV(){

    if(started)
        return;

    started=true;

    document.getElementById(
        "startScreen"
    ).style.display=
    "none";

}


/* =====================================================
   INIT
===================================================== */

function init(){

    updateChannel();

    setInterval(
        secondTimer,
        1000
    );

    draw();

}

init();

</script>
