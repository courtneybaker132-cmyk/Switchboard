<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Retro TV</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:monospace;
    -webkit-user-select:none;
    user-select:none;
}

/* =====================================================
   OUTER "CONSOLE" AREA
===================================================== */

#cabinet{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#080808;
}

/* =====================================================
   CRT FRAME

   Intentionally smaller than entire browser viewport.
   Nintendo/browser controls can remain around it without
   covering important game content.
===================================================== */

#tv{
    position:absolute;

    left:3%;
    top:3%;

    width:94%;
    height:88%;

    background:#171717;

    border-radius:24px;

    box-shadow:
        inset 0 0 0 4px #303030,
        inset 0 0 0 10px #0b0b0b,
        0 8px 25px rgba(0,0,0,.9);
}

/* actual picture */

#picture{
    position:absolute;

    left:2.2%;
    top:3%;

    width:95.6%;
    height:88%;

    background:#000;

    border-radius:18px;

    overflow:hidden;
}

canvas{
    width:100%;
    height:100%;

    display:block;

    image-rendering:pixelated;
}

/* =====================================================
   CRT EFFECTS
===================================================== */

#scanlines{
    pointer-events:none;

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:20;

    opacity:.38;

    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 2px,
        rgba(0,0,0,.30) 3px,
        rgba(0,0,0,.30) 4px
    );
}

#vignette{
    pointer-events:none;

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:21;

    border-radius:18px;

    box-shadow:
        inset 0 0 95px rgba(0,0,0,.85);
}

#glass{
    pointer-events:none;

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:22;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.06),
            rgba(255,255,255,0) 22%
        );
}

/* =====================================================
   TV LABEL AREA
===================================================== */

#brand{
    position:absolute;

    left:32px;
    bottom:17px;

    color:#777;

    letter-spacing:4px;

    font-size:13px;
}

#channel{
    position:absolute;

    right:30px;
    bottom:15px;

    color:#777;

    font-size:13px;
}

/* power LED */

#led{
    position:absolute;

    right:15px;
    bottom:19px;

    width:7px;
    height:7px;

    border-radius:8px;

    background:#00d26a;

    box-shadow:
        0 0 8px #00d26a;
}

/* =====================================================
   OVERLAY INFORMATION
===================================================== */

#osd{
    position:absolute;

    left:24px;
    top:20px;

    z-index:30;

    color:#fff;

    font-size:17px;

    text-shadow:
        2px 2px #000;

    opacity:.75;
}

#nowPlaying{
    margin-top:5px;

    font-size:12px;

    color:#bdbdbd;
}

/* =====================================================
   CONTROLS
===================================================== */

#controls{
    position:absolute;

    left:50%;
    bottom:20px;

    width:680px;

    margin-left:-340px;

    z-index:45;

    text-align:center;

    padding:10px 0;

    border-radius:14px;

    background:rgba(0,0,0,.80);

    opacity:0;
}

.button{
    display:inline-block;

    padding:12px 17px;

    margin:0 4px;

    min-width:58px;

    color:#fff;

    background:#252525;

    border:1px solid #555;

    border-radius:8px;

    font-size:14px;
}

.button:active{
    background:#777;
}

/* =====================================================
   START SCREEN
===================================================== */

#startScreen{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:#000;

    z-index:100;

    color:#fff;

    text-align:center;
}

#startTitle{
    margin-top:175px;

    font-size:48px;

    letter-spacing:10px;
}

#startSubtitle{
    margin-top:22px;

    color:#999;

    font-size:17px;

    animation:blink 1.1s steps(2,start) infinite;
}

#startSmall{
    margin-top:30px;

    color:#555;

    font-size:12px;
}

@keyframes blink{

    50%{
        opacity:.15;
    }

}

/* =====================================================
   CHANNEL CHANGE STATIC
===================================================== */

#static{
    display:none;

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:35;

    background:
    repeating-linear-gradient(
        0deg,
        #111 0px,
        #999 1px,
        #222 2px,
        #777 3px,
        #000 4px
    );

    opacity:.82;
}

/* =====================================================
   PAUSE
===================================================== */

#pauseLabel{
    display:none;

    position:absolute;

    left:0;
    top:45%;

    width:100%;

    text-align:center;

    color:#fff;

    font-size:38px;

    z-index:33;

    letter-spacing:8px;

    text-shadow:
        3px 3px #000;
}

</style>
</head>

<body>

<div id="cabinet">

<div id="tv">

<div id="picture">

<canvas
id="game"
width="960"
height="540">
</canvas>

<div id="scanlines"></div>
<div id="vignette"></div>
<div id="glass"></div>

<div id="static"></div>

<div id="osd">

RETRO TV

<div id="nowPlaying">
CH 01
</div>

</div>

<div id="pauseLabel">
PAUSED
</div>

</div>

<div id="brand">
RETROVISION
</div>

<div id="channel">
CH 01
</div>

<div id="led"></div>

</div>


<div id="controls">

<span class="button"
onclick="previousScene()">
◀
</span>

<span class="button"
onclick="togglePause()"
id="pauseButton">
PAUSE
</span>

<span class="button"
onclick="nextScene()">
▶
</span>

<span class="button"
onclick="toggleMute()"
id="muteButton">
SOUND
</span>

<span class="button"
onclick="toggleShuffle()"
id="shuffleButton">
SHUFFLE
</span>

<span class="button"
onclick="changeDuration()"
id="durationButton">
45 SEC
</span>

</div>


<div id="startScreen"
onclick="startTV()">

<div id="startTitle">
RETRO TV
</div>

<div id="startSubtitle">
TAP TO START
</div>

<div id="startSmall">
CHIPTUNE VIDEO GAME TELEVISION
</div>

</div>

</div>


<script>

/* =====================================================
   CORE
===================================================== */

var canvas =
document.getElementById("game");

var ctx =
canvas.getContext("2d");

var W = 960;
var H = 540;

var scene = 0;
var scenes = 8;

var frame = 0;

var paused = false;

var muted = false;

var shuffle = true;

var duration = 45;

var sceneTime = 0;

var started = false;

var controlsTimer = null;


/* animation compatibility */

var raf =
window.requestAnimationFrame ||
window.webkitRequestAnimationFrame ||
function(fn){

    return setTimeout(fn,33);

};


/* =====================================================
   AUDIO
===================================================== */

var audioContext = null;

var musicTimer = null;

var beat = 0;


function setupAudio(){

    try{

        var AC =
        window.AudioContext ||
        window.webkitAudioContext;

        if(!AC){

            muted = true;

            document.getElementById(
                "muteButton"
            ).innerHTML =
            "NO AUDIO";

            return;
        }

        audioContext =
        new AC();

    }

    catch(e){

        muted = true;

    }

}


/* simple oscillator note */

function tone(
    frequency,
    length,
    type,
    volume
){

    if(
        muted ||
        !audioContext
    ){

        return;

    }

    try{

        var osc =
        audioContext.createOscillator();

        var gain =
        audioContext.createGain();

        osc.type =
        type || "square";

        osc.frequency.value =
        frequency;

        gain.gain.value =
        volume || .025;

        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );

        osc.start(0);

        setTimeout(
            function(){

                try{

                    osc.stop(0);

                }
                catch(e){}

            },

            length
        );

    }

    catch(e){}

}


/* =====================================================
   CHIPTUNE MUSIC ENGINE
===================================================== */

var noteSets = [

/* platform */
[262,330,392,523,392,330,294,349],

/* space */
[110,165,220,330,220,165,147,196],

/* racer */
[130,196,261,392,349,261,196,233],

/* dungeon */
[146,174,220,261,220,174,130,146],

/* fighter */
[196,247,294,392,294,247,220,294],

/* blocks */
[330,392,440,523,440,392,349,440],

/* ocean */
[220,277,330,440,330,277,247,330],

/* city */
[164,246,329,493,392,329,246,293]

];


function musicBeat(){

    if(
        !started ||
        paused ||
        muted
    ){

        return;
    }

    var notes =
    noteSets[scene];

    var note =
    notes[
        beat % notes.length
    ];

    tone(
        note,
        100,
        "square",
        .018
    );

    /* bass every 2 beats */

    if(
        beat % 2 === 0
    ){

        tone(
            note/2,
            130,
            "square",
            .010
        );

    }

    beat++;

}


/* =====================================================
   BASIC DRAW HELPERS
===================================================== */

function clear(c){

    ctx.fillStyle=c;

    ctx.fillRect(
        0,0,W,H
    );

}


function rect(
    x,y,w,h,c
){

    ctx.fillStyle=c;

    ctx.fillRect(
        Math.floor(x),
        Math.floor(y),
        Math.floor(w),
        Math.floor(h)
    );

}


function txt(
    value,
    x,
    y,
    size,
    color
){

    ctx.fillStyle=color;

    ctx.font=
    size+"px monospace";

    ctx.fillText(
        value,x,y
    );

}


function rnd(a,b){

    return Math.floor(
        Math.random() *
        (b-a+1)
    ) + a;

}


/* =====================================================
   STARS
===================================================== */

var stars=[];


function makeStars(){

    var i;

    for(i=0;i<80;i++){

        stars.push({

            x:rnd(0,W),

            y:rnd(0,H),

            s:rnd(1,4)

        });

    }

}


/* =====================================================
   SCENE 1
   PLATFORM KINGDOM
===================================================== */

function platform(){

    clear("#58bde8");

    /* clouds */

    var cx =
    (frame*1.2)%1150;

    rect(
        900-cx,
        80,
        150,
        28,
        "#fff"
    );

    rect(
        940-cx,
        53,
        65,
        35,
        "#fff"
    );

    /* distant land */

    rect(
        0,
        350,
        W,
        190,
        "#439c70"
    );

    /* ground */

    rect(
        0,
        445,
        W,
        95,
        "#754321"
    );

    rect(
        0,
        445,
        W,
        18,
        "#91c83e"
    );

    /* blocks */

    var i;

    for(i=0;i<13;i++){

        rect(
            i*80,
            380,
            55,
            35,
            "#c96522"
        );

    }

    /* coin */

    var coinY =
    290 +
    Math.sin(frame/8)*15;

    rect(
        690,
        coinY,
        18,
        35,
        "#ffd500"
    );

    /* hero */

    var px =
    (frame*2.8)%1080-80;

    var jump =
    Math.abs(
        Math.sin(frame/18)
    )*75;

    rect(
        px,
        402-jump,
        30,
        31,
        "#ef233c"
    );

    rect(
        px+5,
        433-jump,
        22,
        25,
        "#185adb"
    );

    txt(
        "WORLD 1-3",
        25,
        35,
        17,
        "#fff"
    );

    txt(
        "012500",
        835,
        35,
        17,
        "#fff"
    );

}


/* =====================================================
   SCENE 2
   SPACE DEFENDER
===================================================== */

function space(){

    clear("#010108");

    var i;

    for(
        i=0;
        i<stars.length;
        i++
    ){

        stars[i].y +=
        stars[i].s;

        if(
            stars[i].y>H
        ){

            stars[i].y=0;

            stars[i].x=
            rnd(0,W);

        }

        rect(
            stars[i].x,
            stars[i].y,
            stars[i].s,
            stars[i].s*2,
            "#fff"
        );

    }

    var sx =
    430 +
    Math.sin(frame/28)*210;

    rect(
        sx,
        450,
        80,
        22,
        "#00f5d4"
    );

    rect(
        sx+27,
        425,
        26,
        55,
        "#00bbf9"
    );

    if(
        frame%30<15
    ){

        rect(
            sx+39,
            250,
            4,
            175,
            "#ffe600"
        );

    }

    for(i=0;i<6;i++){

        var ex =
        120+i*135+
        Math.sin(
            frame/16+i
        )*35;

        var ey =
        100+
        Math.sin(
            frame/12+i
        )*20;

        rect(
            ex,
            ey,
            42,
            24,
            "#ff006e"
        );

        rect(
            ex+8,
            ey+24,
            8,
            12,
            "#ff006e"
        );

        rect(
            ex+28,
            ey+24,
            8,
            12,
            "#ff006e"
        );

    }

    txt(
        "STAR DEFENDER",
        25,
        35,
        18,
        "#00f5d4"
    );

}


/* =====================================================
   SCENE 3
   NEON HIGHWAY
===================================================== */

function racer(){

    clear("#10002b");

    ctx.fillStyle=
    "#ff4d6d";

    ctx.beginPath();

    ctx.arc(
        480,
        195,
        90,
        0,
        Math.PI*2
    );

    ctx.fill();

    rect(
        0,
        280,
        W,
        260,
        "#03001c"
    );

    ctx.fillStyle=
    "#111";

    ctx.beginPath();

    ctx.moveTo(
        390,280
    );

    ctx.lineTo(
        570,280
    );

    ctx.lineTo(
        840,540
    );

    ctx.lineTo(
        120,540
    );

    ctx.closePath();

    ctx.fill();

    var offset =
    (frame*12)%120;

    var i;

    for(i=0;i<6;i++){

        var y =
        300+i*60+offset;

        var size =
        (y-260)/7;

        rect(
            480-size/2,
            y,
            size,
            20,
            "#fff"
        );

    }

    rect(
        400,
        420,
        160,
        58,
        "#ff006e"
    );

    rect(
        430,
        386,
        100,
        42,
        "#7209b7"
    );

    rect(
        415,
        472,
        35,
        25,
        "#050505"
    );

    rect(
        510,
        472,
        35,
        25,
        "#050505"
    );

    txt(
        "NEON HIGHWAY",
        25,
        38,
        19,
        "#00f5d4"
    );

    txt(
        "220 KM/H",
        810,
        38,
        16,
        "#ff006e"
    );

}


/* =====================================================
   SCENE 4
   DUNGEON
===================================================== */

function dungeon(){

    clear("#13171a");

    var x;
    var y;

    for(y=0;y<8;y++){

        for(x=0;x<13;x++){

            if(
                (x+y)%2===0
            ){

                rect(
                    x*80,
                    y*70,
                    80,
                    70,
                    "#1e2428"
                );

            }

        }

    }

    /* torches */

    rect(
        100,
        115,
        10,
        50,
        "#754321"
    );

    rect(
        90,
        85+
        Math.sin(frame/5)*5,
        30,
        32,
        "#ff9500"
    );

    rect(
        850,
        115,
        10,
        50,
        "#754321"
    );

    rect(
        840,
        85+
        Math.sin(frame/5)*5,
        30,
        32,
        "#ff9500"
    );

    var hx =
    430+
    Math.sin(frame/25)*55;

    rect(
        hx,
        340,
        45,
        70,
        "#4361ee"
    );

    rect(
        hx+8,
        305,
        30,
        38,
        "#f2cc8f"
    );

    rect(
        hx+47,
        315,
        6,
        92,
        "#ddd"
    );

    var slime =
    680+
    Math.sin(frame/15)*35;

    rect(
        slime,
        370,
        65,
        38,
        "#70e000"
    );

    rect(
        slime+12,
        350,
        40,
        25,
        "#70e000"
    );

    txt(
        "DUNGEON QUEST",
        25,
        36,
        18,
        "#d8f3dc"
    );

    txt(
        "HP  ███████░░░",
        25,
        510,
        17,
        "#ff4d6d"
    );

}


/* =====================================================
   SCENE 5
   FIGHTER
===================================================== */

function fighter(){

    clear("#ee9b58");

    rect(
        0,
        275,
        W,
        265,
        "#3d3d3d"
    );

    var i;

    for(i=0;i<8;i++){

        rect(
            i*130,
            100+(i%3)*35,
            90,
            220,
            "#232323"
        );

    }

    /* health */

    rect(
        55,
        45,
        330,
        25,
        "#111"
    );

    rect(
        60,
        50,
        290,
        15,
        "#43aa8b"
    );

    rect(
        575,
        45,
        330,
        25,
        "#111"
    );

    rect(
        610,
        50,
        290,
        15,
        "#ff595e"
    );

    var punch =
    Math.sin(frame/10)*20;

    /* fighter 1 */

    rect(
        220,
        330,
        55,
        115,
        "#277da1"
    );

    rect(
        230,
        295,
        35,
        40,
        "#f2cc8f"
    );

    rect(
        270,
        350,
        70+punch,
        20,
        "#277da1"
    );

    /* fighter 2 */

    rect(
        700,
        330,
        55,
        115,
        "#d90429"
    );

    rect(
        710,
        295,
        35,
        40,
        "#f2cc8f"
    );

    rect(
        640-punch,
        350,
        70+punch,
        20,
        "#d90429"
    );

    txt(
        "ROUND 2",
        440,
        36,
        19,
        "#fff"
    );

}


/* =====================================================
   SCENE 6
   BLOCK DROP
===================================================== */

function blocks(){

    clear("#070707");

    rect(
        315,
        25,
        330,
        495,
        "#111"
    );

    var colors = [
        "#00bbf9",
        "#f15bb5",
        "#fee440",
        "#00f5d4",
        "#9b5de5"
    ];

    var x;
    var y;

    for(y=9;y<15;y++){

        for(x=1;x<10;x++){

            if(
                (x+y)%3!==0
            ){

                rect(
                    325+x*30,
                    40+y*30,
                    28,
                    28,
                    colors[
                        (x+y)%5
                    ]
                );

            }

        }

    }

    var fy =
    ((frame*2)%380)+35;

    rect(
        465,
        fy,
        28,
        28,
        "#00f5d4"
    );

    rect(
        495,
        fy,
        28,
        28,
        "#00f5d4"
    );

    rect(
        525,
        fy,
        28,
        28,
        "#00f5d4"
    );

    rect(
        495,
        fy-30,
        28,
        28,
        "#00f5d4"
    );

    txt(
        "LINES",
        90,
        145,
        18,
        "#fff"
    );

    txt(
        "042",
        90,
        185,
        30,
        "#fee440"
    );

}


/* =====================================================
   SCENE 7
   PIXEL OCEAN
===================================================== */

function ocean(){

    clear("#72d6e8");

    /* sun */

    ctx.fillStyle=
    "#ffe66d";

    ctx.beginPath();

    ctx.arc(
        780,
        100,
        55,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* sea */

    rect(
        0,
        240,
        W,
        300,
        "#0077b6"
    );

    var wave =
    Math.sin(frame/10)*7;

    var i;

    for(i=0;i<12;i++){

        rect(
            i*90+
            ((frame*2)%90)-90,
            270+
            (i%2)*30+
            wave,
            55,
            5,
            "#90e0ef"
        );

    }

    /* island */

    rect(
        80,
        355,
        220,
        80,
        "#d4a373"
    );

    rect(
        150,
        255,
        20,
        110,
        "#6b4423"
    );

    rect(
        90,
        230,
        150,
        45,
        "#52b788"
    );

    /* boat */

    var boatX =
    (frame*1.5)%1200-150;

    rect(
        boatX,
        350+
        Math.sin(frame/12)*6,
        110,
        30,
        "#fff"
    );

    rect(
        boatX+45,
        300+
        Math.sin(frame/12)*6,
        5,
        55,
        "#fff"
    );

    txt(
        "PIXEL ISLAND",
        25,
        35,
        18,
        "#fff"
    );

}


/* =====================================================
   SCENE 8
   NIGHT CITY
===================================================== */

function city(){

    clear("#09001a");

    /* moon */

    ctx.fillStyle=
    "#e0e1dd";

    ctx.beginPath();

    ctx.arc(
        780,
        100,
        45,
        0,
        Math.PI*2
    );

    ctx.fill();

    var i;

    for(i=0;i<12;i++){

        var bh =
        130+
        (i%5)*35;

        rect(
            i*90,
            500-bh,
            72,
            bh,
            "#15152c"
        );

        var floor;

        for(
            floor=0;
            floor<4;
            floor++
        ){

            if(
                (i+floor+
                Math.floor(frame/90))
                %3!==0
            ){

                rect(
                    i*90+15,
                    390-bh+
                    floor*35+100,
                    11,
                    14,
                    "#ffd166"
                );

                rect(
                    i*90+43,
                    390-bh+
                    floor*35+100,
                    11,
                    14,
                    "#ffd166"
                );

            }

        }

    }

    /* road */

    rect(
        0,
        470,
        W,
        70,
        "#111"
    );

    var car =
    (frame*4)%1100-100;

    rect(
        car,
        480,
        90,
        30,
        "#ff006e"
    );

    rect(
        car+20,
        462,
        50,
        22,
        "#8338ec"
    );

    rect(
        car-20,
        493,
        18,
        5,
        "#ffbe0b"
    );

    txt(
        "MIDNIGHT CITY",
        25,
        35,
        18,
        "#f15bb5"
    );

}


/* =====================================================
   DRAW LOOP
===================================================== */

function draw(){

    if(
        started &&
        !paused
    ){

        frame++;

        if(scene===0)platform();

        if(scene===1)space();

        if(scene===2)racer();

        if(scene===3)dungeon();

        if(scene===4)fighter();

        if(scene===5)blocks();

        if(scene===6)ocean();

        if(scene===7)city();

    }

    raf(draw);

}


/* =====================================================
   CHANNEL NAMES
===================================================== */

var names = [

"PIXEL KINGDOM",

"STAR DEFENDER",

"NEON HIGHWAY",

"DUNGEON QUEST",

"STREET BATTLE",

"BLOCK DROP",

"PIXEL ISLAND",

"MIDNIGHT CITY"

];


function updateChannel(){

    var number =
    scene+1;

    var display =
    number<10 ?
    "0"+number :
    number;

    document.getElementById(
        "channel"
    ).innerHTML =
    "CH "+display;

    document.getElementById(
        "nowPlaying"
    ).innerHTML =
    "CH "+display+
    " · "+
    names[scene];

}


/* =====================================================
   CHANNEL STATIC
===================================================== */

function channelStatic(){

    var staticBox =
    document.getElementById(
        "static"
    );

    staticBox.style.display=
    "block";

    tone(
        65,
        100,
        "square",
        .018
    );

    setTimeout(
        function(){

            staticBox.style.display=
            "none";

        },
        180
    );

}


/* =====================================================
   NEXT / PREVIOUS
===================================================== */

function nextScene(){

    channelStatic();

    if(shuffle){

        var old=scene;

        while(
            scene===old &&
            scenes>1
        ){

            scene=
            rnd(
                0,
                scenes-1
            );

        }

    }

    else{

        scene++;

        if(scene>=scenes){

            scene=0;

        }

    }

    frame=0;

    beat=0;

    sceneTime=0;

    updateChannel();

}


function previousScene(){

    channelStatic();

    scene--;

    if(scene<0){

        scene=
        scenes-1;

    }

    frame=0;

    beat=0;

    sceneTime=0;

    updateChannel();

}


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

    paused=!paused;

    if(paused){

        document.getElementById(
            "pauseButton"
        ).innerHTML=
        "PLAY";

        document.getElementById(
            "pauseLabel"
        ).style.display=
        "block";

    }

    else{

        document.getElementById(
            "pauseButton"
        ).innerHTML=
        "PAUSE";

        document.getElementById(
            "pauseLabel"
        ).style.display=
        "none";

    }

}


/* =====================================================
   SOUND
===================================================== */

function toggleMute(){

    muted=!muted;

    if(muted){

        document.getElementById(
            "muteButton"
        ).innerHTML=
        "MUTED";

    }

    else{

        document.getElementById(
            "muteButton"
        ).innerHTML=
        "SOUND";

        tone(
            440,
            80,
            "square",
            .03
        );

    }

}


/* =====================================================
   SHUFFLE
===================================================== */

function toggleShuffle(){

    shuffle=!shuffle;

    if(shuffle){

        document.getElementById(
            "shuffleButton"
        ).innerHTML=
        "SHUFFLE ON";

    }

    else{

        document.getElementById(
            "shuffleButton"
        ).innerHTML=
        "SHUFFLE OFF";

    }

}


/* =====================================================
   CHANNEL DURATION
===================================================== */

function changeDuration(){

    if(duration===30){

        duration=45;

    }

    else if(duration===45){

        duration=60;

    }

    else if(duration===60){

        duration=120;

    }

    else{

        duration=30;

    }

    sceneTime=0;

    document.getElementById(
        "durationButton"
    ).innerHTML=
    duration+
    " SEC";

}


/* =====================================================
   AUTOMATIC CHANNEL SWITCH
===================================================== */

function timer(){

    if(
        started &&
        !paused
    ){

        sceneTime++;

        if(
            sceneTime>=duration
        ){

            nextScene();

        }

    }

}


/* =====================================================
   CONTROLS
===================================================== */

function showControls(){

    var controls =
    document.getElementById(
        "controls"
    );

    controls.style.opacity=
    "1";

    if(controlsTimer){

        clearTimeout(
            controlsTimer
        );

    }

    controlsTimer=
    setTimeout(
        function(){

            controls.style.opacity=
            "0";

        },
        4000
    );

}


document.addEventListener(
    "touchstart",
    showControls,
    false
);

document.addEventListener(
    "click",
    showControls,
    false
);


/* =====================================================
   START
===================================================== */

function startTV(){

    if(started){

        return;

    }

    started=true;

    setupAudio();

    document.getElementById(
        "startScreen"
    ).style.display=
    "none";

    updateChannel();

    tone(
        440,
        80,
        "square",
        .03
    );

    setTimeout(
        function(){

            tone(
                660,
                100,
                "square",
                .025
            );

        },
        90
    );

}


function init(){

    makeStars();

    updateChannel();

    setInterval(
        timer,
        1000
    );

    /*
      roughly 8-bit music tempo
    */

    musicTimer=
    setInterval(
        musicBeat,
        220
    );

    draw();

}


init();

</script>
